[project]
name = "pokeproject"
version = "1.0.0"
description = "A Django Pokedex: search PokeAPI, save Pokemon, and battle them."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "RUF",
]
ignore = [
    # Django's Meta.constraints / Meta.indexes / dependencies are class-level
    # lists by design; ClassVar annotations on them would be noise.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Auto-generated by makemigrations; not worth reformatting by hand.
"*/migrations/*" = ["E501", "I001"]
"pokeproject/settings.py" = ["E501"]

[tool.coverage.run]
source = ["pokedex"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true

# Local development overrides. Compose loads this automatically on top of
# docker-compose.yml, so `docker compose up` gets developer conveniences that
# must never reach production.
#
# Deploy with the base file only:
#   docker compose -f docker-compose.yml up -d
services:
  db:
    # Published so `manage.py test` can run from the host. Port 5433 avoids
    # colliding with any Postgres already listening on the default 5432.
    ports:
      - "5433:5432"
